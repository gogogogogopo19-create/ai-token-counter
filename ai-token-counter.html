<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Token 计数器</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f7;color:#111}
main{max-width:680px;margin:auto;padding:24px 16px 40px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0000000b}
h1{font-size:28px;margin:8px 0}.sub{color:#666;line-height:1.5}
textarea{width:100%;box-sizing:border-box;min-height:110px;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:16px;resize:vertical}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;background:#111;color:white;margin-top:10px}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f5f5f7;border-radius:14px;padding:14px}.num{font-size:25px;font-weight:700}.label{font-size:13px;color:#666;margin-top:4px}
#answer{white-space:pre-wrap;line-height:1.6}.err{color:#c00;white-space:pre-wrap}
.small{font-size:13px;color:#777;line-height:1.5}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🤖 AI Token 计数器</h1>
<div class="sub">输入一句话，程序调用你的 AI 后，自动读取这次请求的 Token 数。</div>
</div>

<div class="card">
<label>你的问题</label>
<textarea id="prompt" placeholder="例如：用简单的话解释一下 API 是什么"></textarea>
<button id="send">发送给 AI</button>
<div id="status" class="small"></div>
</div>

<div class="card">
<h3>📊 本次 Token</h3>
<div class="grid">
<div class="stat"><div class="num" id="input">—</div><div class="label">输入 Token</div></div>
<div class="stat"><div class="num" id="output">—</div><div class="label">输出 Token</div></div>
<div class="stat"><div class="num" id="total">—</div><div class="label">总 Token</div></div>
</div>
</div>

<div class="card">
<h3>💬 AI 回复</h3>
<div id="answer" class="sub">还没有回复。</div>
<div id="error" class="err"></div>
</div>

<div class="card">
<h3>⚙️ 连接方式</h3>
<p class="small">这个网页本身不保存 API Key，也不会让你把 API Key 填进网页。正式使用时，应由你自己的后端服务器保存 API Key，再由网页调用后端。</p>
<p class="small">你现在用 iPhone 也可以使用这个界面；下一步只需要把“后端”接上即可。</p>
</div>
</main>

<script>
const send=document.querySelector('#send');
send.onclick=async()=>{
  const prompt=document.querySelector('#prompt').value.trim();
  const status=document.querySelector('#status');
  const answer=document.querySelector('#answer');
  const error=document.querySelector('#error');
  if(!prompt){status.textContent='先输入一句话。';return}
  send.disabled=true; status.textContent='正在请求 AI…'; error.textContent=''; answer.textContent='';
  try{
    // 这里故意不放 API Key。
    // 正式接入时，将 /api/chat 替换成你的安全后端地址。
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:prompt})
    });
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'请求失败');
    answer.textContent=data.text||'';
    document.querySelector('#input').textContent=data.usage?.input_tokens ?? '—';
    document.querySelector('#output').textContent=data.usage?.output_tokens ?? '—';
    document.querySelector('#total').textContent=data.usage?.total_tokens ?? '—';
    status.textContent='完成 ✓';
  }catch(e){
    error.textContent='暂时还没连接后端：'+e.message;
    status.textContent='等待后端连接';
  }finally{send.disabled=false}
};
</script>
</body>
</html>
